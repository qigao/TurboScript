name: TurboScript native SDK release
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - "v*"
permissions:
  contents: read
  packages: read
concurrency:
  group: turboscript-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION [0-9]/{print $2; exit}' CMakeLists.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          if [[ "$vcpkg_version" != "$version" ]]; then
            echo "release version mismatch: CMake=$version vcpkg=$vcpkg_version" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$tag" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/master ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "version=$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
  source-test:
    name: Linux source / full CTest
    needs: metadata
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare source-test toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Configure full source test graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/source-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DENABLE_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_MODULES=ON \
            -DTURBOSCRIPT_BUILD_CLI=OFF
      - name: Build full source test graph
        shell: bash
        run: cmake --build build/source-test --parallel 2
      - name: Run full CTest graph
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$TURBODB_ROOT/lib:$CHTTP_ROOT/lib:$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/source-test --no-tests=error --output-on-failure
      - name: Run CFlow qualification benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$TURBODB_ROOT/lib:$CHTTP_ROOT/lib:$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          "$GITHUB_WORKSPACE/build/source-test/bin/bench_turbo_script_cflow" |
            tee "$GITHUB_WORKSPACE/build/source-test/cflow-qualification-benchmark.txt"
      - name: Verify exact head and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git status --short --untracked-files=no
          git diff -- . ':(exclude)build/**'
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code

  host-sanitizer:
    name: Linux Host MIR / ASan+UBSan+LSan
    needs: metadata
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Configure sanitized Host graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/host-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DENABLE_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_MODULES=ON \
            -DTURBOSCRIPT_BUILD_CLI=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON
      - name: Build Host and CFlow sanitizer targets
        shell: bash
        run: |
          cmake --build build/host-sanitizer \
            --target test_turbo_script_host_module \
                     test_turbo_script_cflow_mir_kernel \
                     test_turbo_script_cflow_lower \
                     test_turbo_script_cflow_qualification \
            --parallel 2
      - name: Run Host and CFlow suites under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$TURBODB_ROOT/lib:$CHTTP_ROOT/lib:$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          unset LSAN_OPTIONS
          ctest --test-dir build/host-sanitizer \
            -R '^(test_turbo_script_host_module|test_turbo_script_cflow_mir_kernel|test_turbo_script_cflow_lower|test_turbo_script_cflow_qualification)$' \
            --no-tests=error --verbose --output-on-failure \
            --output-junit host-cflow-sanitizer-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-cflow-sanitizer-evidence
          path: build/host-sanitizer/host-cflow-sanitizer-results.xml
          if-no-files-found: error

  host-abi:
    name: Linux installed Host ABI v1
    needs: metadata
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare Host ABI toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Build modules-off Host contracts and install SDK
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/host-abi"
          cmake -S . -B build/host-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            "-DCMAKE_INSTALL_PREFIX=$prefix" \
            -DBUILD_TESTING=ON -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_HOST_TESTS=ON \
            -DTURBOSCRIPT_BUILD_MODULES=OFF \
            -DTURBOSCRIPT_BUILD_CLI=OFF
          cmake --build build/host-abi --parallel 2
          export LD_LIBRARY_PATH="$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/host-abi -R '^test_turbo_script_host_' \
            --no-tests=error --output-on-failure
          cmake --install build/host-abi
      - name: Verify installed public-only C11 and C++17 consumers
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/host-abi"
          export LD_LIBRARY_PATH="$prefix/lib:$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S cmake/ci/host-abi -B build/installed-host-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DTurboScript_DIR=$prefix/lib/cmake/TurboScript" \
            "-DCMAKE_PREFIX_PATH=$prefix;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/installed-host-abi --parallel 2
          ctest --test-dir build/installed-host-abi --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git status --short --untracked-files=no
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code

  build:
    needs: metadata
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      needs.metadata.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, rid: linux-x64, triplet: x64-linux}
          - {runner: macos-15, rid: macos-arm64, triplet: arm64-osx}
          - {runner: ubuntu-24.04, rid: android-arm64-v8a, triplet: arm64-android}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RID: ${{ matrix.rid }}
      TRIPLET: ${{ matrix.triplet }}
      SDK_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build pkg-config nasm
          else
            brew install ninja nasm
          fi
          if [[ "$RID" == macos-arm64 ]]; then test "$(uname -m)" = arm64; fi
      - name: Restore current dependency SDKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh "$RID"
      - name: Configure, build and install SDK with native modules
        shell: bash
        run: |
          set -euo pipefail
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$RID" == android-arm64-v8a ]]; then
            mkdir -p build/host
            cc tools/lemon/lemon.c -o build/host/lemon
            args+=( -DCMAKE_SYSTEM_NAME=Android
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared
              "-DTURBOSCRIPT_HOST_LEMON_EXECUTABLE=$GITHUB_WORKSPACE/build/host/lemon" )
          fi
          cmake -S . -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            "-DVCPKG_TARGET_TRIPLET=$TRIPLET" "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/stage/$RID" \
            -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_MODULES=ON -DTURBOSCRIPT_BUILD_CLI=OFF "${args[@]}"
          cmake --build build/sdk --parallel 2
          cmake --install build/sdk
          cat > "stage/$RID/turboscript-sdk-manifest.txt" <<EOF
          version=$SDK_VERSION
          commit=$(git rev-parse HEAD)
          rid=$RID
          profile=Release
          interpreter=MIR
          jit=MIR
          modules=ON
          cli=OFF
          salts_release=$SALTS_SDK_RELEASE
          salts_utils_release=$SALTS_UTILS_SDK_RELEASE
          chttp_release=$CHTTP_SDK_RELEASE
          EOF
          mkdir -p dist
          tar -chzf "dist/turboscript-$RID.tar.gz" -C stage "$RID"
      - name: Verify relocated SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          relocated="$RUNNER_TEMP/turboscript-sdk"
          mkdir -p "$relocated"
          tar -xzf "dist/turboscript-$RID.tar.gz" -C "$relocated"
          mv stage stage-hidden
          prefix="$relocated/$RID"
          export TURBOSCRIPT_ROOT="$prefix"
          export LD_LIBRARY_PATH="$prefix/lib:$TURBODB_ROOT/lib:$CHTTP_ROOT/lib:$TURBODB_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET/lib"
          export DYLD_LIBRARY_PATH="$LD_LIBRARY_PATH"
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "$RID" == android-arm64-v8a ]]; then
            args+=( -DCMAKE_SYSTEM_NAME=Android
              "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared )
          fi
          cmake -S cmake/ci/sdk-smoke -B build/sdk-smoke -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$prefix;$CHTTP_ROOT;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            "-DTurboScript_DIR=$prefix/lib/cmake/TurboScript" \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            "-DVCPKG_TARGET_TRIPLET=$TRIPLET" -DVCPKG_MANIFEST_MODE=OFF \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" "${args[@]}"
          cmake --build build/sdk-smoke --parallel 2
          if [[ "$RID" == android-arm64-v8a ]]; then
            readelf -h "$prefix/lib/libturbo_script.so" | tee "$RUNNER_TEMP/elf-header.txt"
            grep -q 'AArch64' "$RUNNER_TEMP/elf-header.txt"
            echo 'Android: cross-link validated; device runtime not exercised.' >> "$GITHUB_STEP_SUMMARY"
          else
            ctest --test-dir build/sdk-smoke --no-tests=error --output-on-failure
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: turboscript-sdk-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error
  pack:
    needs: [metadata, source-test, host-sanitizer, host-abi, build]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.metadata.outputs.release == 'true') &&
      needs.metadata.result == 'success' &&
      needs.source-test.result == 'success' &&
      needs.host-sanitizer.result == 'success' &&
      needs.host-abi.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: turboscript-sdk-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pack SDK graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/sdk
          for rid in linux-x64 macos-arm64 android-arm64-v8a; do
            tar -xzf "dist/turboscript-$rid.tar.gz" -C package/sdk
            test -f "package/sdk/$rid/lib/cmake/TurboScript/TurboScriptConfig.cmake"
          done
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github \
            --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet pack packaging/nuget/TurboScript.Native.csproj --configuration Release --output dist \
            "-p:PackageVersion=$SDK_VERSION" "-p:PackageRoot=$GITHUB_WORKSPACE/package"
          unzip -Z1 "dist/TurboScript.Native.$SDK_VERSION.nupkg" > "$RUNNER_TEMP/package-files.txt"
          for rid in linux-x64 macos-arm64 android-arm64-v8a; do
            grep -Fx "sdk/$rid/include/turbo_script.h" "$RUNNER_TEMP/package-files.txt"
            grep -Fx "sdk/$rid/lib/cmake/TurboScript/TurboScriptTargets.cmake" "$RUNNER_TEMP/package-files.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: turboscript-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error
  publish:
    name: Publish package and GitHub Release
    needs: [metadata, pack]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.metadata.outputs.release == 'true' &&
      needs.pack.result == 'success' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turboscript-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github \
            --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/TurboScript.Native.$SDK_VERSION.nupkg" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$SDK_VERSION"
          pkg="dist/TurboScript.Native.$SDK_VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "TurboScript $SDK_VERSION" --generate-notes
          fi
