name: TurboScript source qualification
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  packages: read
concurrency:
  group: turboscript-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION [0-9]/{print $2; exit}' CMakeLists.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json", encoding="utf-8"))["version-semver"])')"
          if [[ "$vcpkg_version" != "$version" ]]; then
            echo "release version mismatch: CMake=$version vcpkg=$vcpkg_version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_tag="v$version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$expected_tag" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
  source-test:
    name: Linux source / full CTest
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare source-test toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Configure full source test graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/source-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DENABLE_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_MODULES=ON \
            -DTURBOSCRIPT_BUILD_CLI=OFF
      - name: Build full source test graph
        shell: bash
        run: cmake --build build/source-test --parallel 2
      - name: Run full CTest graph
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/source-test --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git status --short --untracked-files=no
          git diff -- . ':(exclude)build/**'
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code

  host-sanitizer:
    name: Linux Host MIR / ASan+UBSan+LSan
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare sanitizer toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Configure sanitized Host graph
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/host-sanitizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DENABLE_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_MODULES=ON \
            -DTURBOSCRIPT_BUILD_CLI=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON
      - name: Build Host and CFlow sanitizer targets
        shell: bash
        run: |
          cmake --build build/host-sanitizer \
            --target test_turbo_script_host_module \
                     test_turbo_script_cflow_mir_kernel \
                     test_turbo_script_cflow_lower \
            --parallel 2
      - name: Run Host and CFlow suites under sanitizers
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          unset LSAN_OPTIONS
          ctest --test-dir build/host-sanitizer \
            -R '^(test_turbo_script_host_module|test_turbo_script_cflow_mir_kernel|test_turbo_script_cflow_lower)$' \
            --no-tests=error --verbose --output-on-failure \
            --output-junit host-cflow-sanitizer-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-cflow-sanitizer-evidence
          path: build/host-sanitizer/host-cflow-sanitizer-results.xml
          if-no-files-found: error

  host-abi:
    name: Linux installed Host ABI v1
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare Host ABI toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
      - name: Restore current dependency SDK graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash cmake/ci/restore-current-native-sdks.sh linux-x64
      - name: Build modules-off Host contracts and install SDK
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/host-abi"
          cmake -S . -B build/host-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            "-DCMAKE_INSTALL_PREFIX=$prefix" \
            -DBUILD_TESTING=ON -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DTURBOSCRIPT_BUILD_HOST_TESTS=ON \
            -DTURBOSCRIPT_BUILD_MODULES=OFF \
            -DTURBOSCRIPT_BUILD_CLI=OFF
          cmake --build build/host-abi --parallel 2
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          ctest --test-dir build/host-abi -R '^test_turbo_script_host_' \
            --no-tests=error --output-on-failure
          cmake --install build/host-abi
      - name: Verify installed public-only C11 and C++17 consumers
        shell: bash
        run: |
          set -euxo pipefail
          prefix="$GITHUB_WORKSPACE/stage/host-abi"
          export LD_LIBRARY_PATH="$prefix/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/debug/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S cmake/ci/host-abi -B build/installed-host-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DTurboScript_DIR=$prefix/lib/cmake/TurboScript" \
            "-DCMAKE_PREFIX_PATH=$prefix;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/installed-host-abi --parallel 2
          ctest --test-dir build/installed-host-abi --no-tests=error --output-on-failure
      - name: Verify exact head and clean tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git status --short --untracked-files=no
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code

