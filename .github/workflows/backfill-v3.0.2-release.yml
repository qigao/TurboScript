name: Backfill TurboScript 3.0.2 GitHub Release

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/backfill-v3.0.2-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - name: Download qualified 3.0.2 package artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 36469283774 --repo "$GITHUB_REPOSITORY" \
            --name turboscript-native-nuget --dir dist
          test -f dist/TurboScript.Native.3.0.2.nupkg
      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v3.0.2"
          pkg="dist/TurboScript.Native.3.0.2.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" \
              --target e9cc33c8db1ec28f498cdd8239455a646260d566 \
              --title "TurboScript 3.0.2" --generate-notes
          fi
