name: Prepare prototype name lifetime correction

on:
  push:
    branches: [fix/embedded-runtime-package]
    paths: [.github/workflows/prepare-prototype-name-lifetime.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare exact source changes without moving a branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/prepared-prototype-fix
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def post(endpoint, payload):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', '--method', 'POST', endpoint, '--input', '-'],
                  input=json.dumps(payload), text=True))

          repository = 'qigao/TurboScript'
          publisher = '.github/workflows/prepare-prototype-name-lifetime.yml'
          source_base = 'eaca75c797acd595c4d72c7fea2ab76b04a950c6'
          head = git('rev-parse', 'HEAD')
          assert os.environ['GITHUB_REPOSITORY'] == repository
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/embedded-runtime-package'
          assert head == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == source_base
          assert git('diff', '--name-only', 'HEAD^', 'HEAD').splitlines() == [publisher]
          assert not git('status', '--porcelain', '--untracked-files=no')
          runtime = Path('turbo_script/src/mir/turbo_script_mir_runtime.c')
          test = Path('turbo_script/test/test_turbo_script_host_module.c')
          expected = {
              str(runtime): ('20df47d24cdd1142487ea9043b3b75fd8729d6bf', 'e3f7295fb97875d52dfe82755cb20b21bae13550'),
              str(test): ('57609e5a9288d8daf1c0077ce56ed941b8d95f82', '6f9713adb24ed1bdbfdcfef0a6d0b4a4bf8fb207'),
          }
          for name, (before, _) in expected.items():
              assert blob_sha(Path(name).read_bytes()) == before, name
          old = '''static const char *ts_mir_prefixed_item_name(ts_mir_compiler_t *c, const char *name) {
            char buf[192];
            snprintf(buf, sizeof(buf), "%s_%s", c && c->item_prefix[0] ? c->item_prefix : "ts_mir", name);
            return strdup(buf);
          }'''
          new = '''static MIR_item_t ts_mir_new_prefixed_proto(ts_mir_compiler_t *c, const char *name,
                                                       size_t nres, MIR_type_t *res_types,
                                                       size_t nargs, MIR_var_t *args) {
            char buf[192];
            snprintf(buf, sizeof(buf), "%s_%s", c->item_prefix[0] ? c->item_prefix : "ts_mir", name);
            /* MIR copies the name into its context. No caller-owned heap copy is needed. */
            return MIR_new_proto_arr(c->ctx, buf, nres, res_types, nargs, args);
          }'''
          text = runtime.read_text()
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text, count = re.subn(
              r'MIR_new_proto_arr\(\s*ctx, ts_mir_prefixed_item_name\(c, ("[^"\n]+")\),',
              r'ts_mir_new_prefixed_proto(c, \1,', text)
          assert count == 66 and 'ts_mir_prefixed_item_name' not in text
          runtime.write_text(text)
          case = '''  it("releases MIR prototype names across repeated module lifetimes") {
            enum { MODULE_CYCLES = 4 };
            static const turbo_script_execution_mode_t modes[] = {
                TURBO_SCRIPT_EXEC_INTERPRETER, TURBO_SCRIPT_EXEC_JIT};
            turbo_script_ctx_t *ctx = turbo_script_init(TURBO_SCRIPT_INIT_BARE);
            turbo_script_result_t *result = NULL;
            turbo_script_module_options_t module_options;
            check_not_null(ctx);
            check_equal(turbo_script_result_create(ctx, &result), TURBO_SCRIPT_STATUS_OK);
            turbo_script_module_options_init(&module_options);
            for (int cycle = 0; cycle < MODULE_CYCLES; ++cycle) {
              turbo_script_module_t *module = NULL;
              /* No named variables: isolate the temporary external-prototype names. */
              check_equal(compile_text(ctx, result, "1 + 2;", &module_options, &module),
                          TURBO_SCRIPT_STATUS_OK);
              for (size_t mode = 0; mode < sizeof(modes) / sizeof(modes[0]); ++mode) {
                turbo_script_instance_options_t options;
                turbo_script_instance_t *instance = NULL;
                turbo_script_instance_options_init(&options);
                options.mode = modes[mode];
                check_equal(turbo_script_instance_create(module, &options, result, &instance),
                            TURBO_SCRIPT_STATUS_OK);
                check_equal(turbo_script_instance_destroy(instance, result), TURBO_SCRIPT_STATUS_OK);
              }
              check_equal(turbo_script_module_destroy(module, result), TURBO_SCRIPT_STATUS_OK);
            }
            destroy_fixture(ctx, result, NULL);
          }

          '''
          text = test.read_text()
          anchor = 'spec("TurboScript immutable Host modules") {\n'
          assert text.count(anchor) == 1
          test.write_text(text.replace(anchor, anchor + case, 1))
          for name, (_, after) in expected.items():
              assert blob_sha(Path(name).read_bytes()) == after, name
          Path(publisher).unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          assert set(git('diff', '--name-only').splitlines()) == set(expected) | {publisher}
          output = Path('build/prepared-prototype-fix')
          (output / 'source.patch').write_text(subprocess.check_output(
              ['git', 'diff', '--', *expected], text=True))
          changes = []
          for name, (_, after) in expected.items():
              blob = post(f'repos/{repository}/git/blobs', {
                  'encoding': 'utf-8', 'content': Path(name).read_text()})
              assert blob['sha'] == after
              changes.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': after})
          changes.append({'path': publisher, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = post(f'repos/{repository}/git/trees', {
              'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': changes})
          commit = post(f'repos/{repository}/git/commits', {
              'message': 'fix(mir): stop leaking temporary external prototype names\n\nConstruct each of the 66 names on the stack and let MIR_new_proto_arr copy it into the owning MIR context. Remove the redundant strdup, preserving prototype names, signatures, registration order and backend selection.\n\nAdd a regression to the existing Host module suite: four complete module lifetimes and interpreter/JIT instance initialization and destruction. Local same-compiler before/after runs change the isolated result from 5688 bytes in 264 allocations to leak-free exit. The full module suite still exposes 92 bytes in 44 variable-name allocations; other Host and mainline integration gates remain open.\n\nRemove the one-shot preparer. Refs #1, #8 and qigao/stun#31. No dependency fallback, sanitizer suppression or merge.',
              'tree': tree['sha'], 'parents': [head]})
          record = {'source_base': source_base, 'parent': head, 'commit': commit['sha'],
                    'tree': tree['sha'], 'files': expected, 'ref_updated': False,
                    'scope': 'Exact source publication only. No remote runtime validation is claimed.'}
          (output / 'commit.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-name-fix-${{ github.sha }}
          path: build/prepared-prototype-fix
          if-no-files-found: error
