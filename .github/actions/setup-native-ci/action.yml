name: Native CI dependencies with curl
description: Pinned vcpkg contract and GitHub package downloads without Mono or NuGet.
runs:
  using: composite
  steps:
    - name: Checkout immutable shared cache contract
      uses: actions/checkout@v4
      with:
        repository: qigao/vcpkg-cache
        ref: d4afc8cd2f5ed3585c1e26469e379a087ce9ecf3
        path: build/ci-vcpkg-contract
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Bootstrap canonical vcpkg and read-only curl cache
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python cmake/ci/setup_native_ci.py build/ci-vcpkg-contract
